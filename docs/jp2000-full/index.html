<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>2000 từ tiếng Nhật</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--ink:#1c1917;--dim:#78716c;--line:#e7e2da;--accent:#b45309;--accentbg:#fff7e6}
@media (prefers-color-scheme:dark){:root{--bg:#171412;--card:#24201d;--ink:#f5f5f4;--dim:#a8a29e;--line:#3b3531;--accent:#fbbf24;--accentbg:#2c2416}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,system-ui,"Segoe UI",sans-serif;padding:14px 16px 60px}
.wrap{max-width:820px;margin:0 auto}
h1{font-size:20px;margin:0 0 4px}
.dim{color:var(--dim);font-size:13px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:12px 0}
.panel h2{font-size:14px;margin:0 0 8px;color:var(--dim)}
audio{width:100%}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5}
.bar input[type=search]{flex:1;min-width:180px;padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:inherit;font:inherit}
.bar select,.bar button,.bar label{padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:inherit;font:inherit;font-size:13px}
.bar label{display:flex;gap:6px;align-items:center;cursor:pointer}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0}
.head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.num{color:var(--dim);font-size:12px;min-width:38px}
.w{font-size:24px;font-family:"Hiragino Mincho ProN","Yu Mincho",serif}
.r{color:var(--accent);font-weight:600}
.p{font-size:11.5px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--dim)}
.m{font-size:15px}
.jp{font-size:17px;margin-top:6px;font-family:"Hiragino Sans","Yu Gothic",sans-serif}
.en{font-size:14px;color:var(--dim);margin-top:2px}
.hideEn .en{filter:blur(5px)}
.hideEn .en:hover{filter:none}
.say{border:none;background:none;cursor:pointer;font-size:15px;padding:0 4px}
.more{display:block;margin:14px auto;padding:10px 18px;border:1px solid var(--accent);color:var(--accent);background:var(--accentbg);border-radius:9px;font:inherit;font-weight:700;cursor:pointer}
.miss{color:#b91c1c;font-size:12.5px}
</style>
<link rel="stylesheet" href="../assets/ui.css">
<script src="../assets/ui.js" data-section="Tiếng Nhật" data-title="2000 từ tiếng Nhật"></script>
</head>
<body>
<div class="wrap">
  <h1>🗾 2000 Most Common Japanese Words in Context</h1>
  <div class="dim">Bản riêng trên máy (không có trên GitHub). Nội dung lấy từ sách Lingo Mastery bạn đã có.</div>



  <div class="bar">
    <input type="search" id="q" placeholder="Tìm: từ, romaji, nghĩa, câu ví dụ…">
    <select id="range"></select>
    <label><input type="checkbox" id="hideEn"> Che bản dịch</label>
  </div>
  <div class="dim" id="count"></div>
  <div id="list"></div>
  <button class="more" id="more">Xem thêm</button>
</div>
<script src="data.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
const D=(window.JP2000||[]).map(r=>({n:r[0],w:r[1],r:r[2],p:r[3],m:r[4],jp:r[5],en:r[6]}));
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

// list
const rangeSel=$("range");
rangeSel.innerHTML='<option value="all">Tất cả</option>'+Array.from({length:10},(_,c)=>`<option value="${c}">${c*200+1}–${(c+1)*200}</option>`).join("");
rangeSel.value=ls.get("jp2000Range","all");
$("hideEn").checked=ls.get("jp2000HideEn",false);
document.body.classList.toggle("hideEn",$("hideEn").checked);
$("hideEn").onchange=e=>{document.body.classList.toggle("hideEn",e.target.checked);ls.set("jp2000HideEn",e.target.checked);};
let shown=0,cur=[];
const PAGE=Infinity;   // show all words at once
function jaVoice(){return speechSynthesis.getVoices().find(v=>/^ja/i.test(v.lang));}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="ja-JP";const v=jaVoice();if(v)u.voice=v;u.rate=.9;speechSynthesis.speak(u);}catch(e){}}
function filter(){
  const q=$("q").value.trim().toLowerCase();const r=rangeSel.value;
  cur=D.filter(x=>(r==="all"||Math.floor((x.n-1)/200)===+r)&&(!q||[x.w,x.r,x.m,x.jp,x.en].some(s=>String(s).toLowerCase().includes(q))));
  shown=0;$("list").innerHTML="";more();
  $("count").textContent=`${cur.length} từ`;
}
function more(){
  const part=cur.slice(shown,shown+PAGE);shown+=part.length;
  $("list").insertAdjacentHTML("beforeend",part.map(x=>`<div class="item">
    <div class="head"><span class="num">${x.n}</span><span class="w">${esc(x.w)}</span>
      <button class="say" data-t="${esc(x.w)}" title="Nghe từ">🔊</button>
      <span class="r">${esc(x.r)}</span><span class="p">${esc(x.p)}</span><span class="m">${esc(x.m)}</span></div>
    ${x.jp?`<div class="jp">${esc(x.jp)} <button class="say" data-t="${esc(x.jp)}" title="Nghe câu">🔊</button></div><div class="en">${esc(x.en)}</div>`:""}
  </div>`).join(""));
  $("more").style.display=shown<cur.length?"":"none";
}
$("list").addEventListener("click",e=>{const b=e.target.closest(".say");if(b)say(b.dataset.t);});
$("more").onclick=more;
let tmr;$("q").oninput=()=>{clearTimeout(tmr);tmr=setTimeout(filter,200);};
rangeSel.onchange=()=>{ls.set("jp2000Range",rangeSel.value);filter();};
filter();
})();
</script>
</body>
</html>
