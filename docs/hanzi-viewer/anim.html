<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chữ Hán chuyển động</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; }
    main { max-width:1000px; margin:auto; padding:4px 16px 40px; }
    h1 { margin:0 0 4px; font-size:24px; }
    .sub { color:var(--muted); margin:0 0 12px; font-size:14px; }
    .bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:10px; }
    .bar label { display:flex; gap:6px; align-items:center; font-size:14px; color:var(--muted); }
    select, input { padding:8px 10px; border:1px solid var(--line); border-radius:9px; background:var(--card); color:inherit; font:inherit; }
    input[type=number] { width:76px; }
    input#q { width:130px; }
    .btn { border:1px solid var(--line); background:var(--card); color:inherit; border-radius:9px; padding:8px 12px; font:inherit; font-size:14px; cursor:pointer; }
    .btn:hover { border-color:var(--accent); }
    .btn.primary { background:var(--accentbg); border-color:var(--accent); color:var(--accent); font-weight:700; min-width:96px; }
    .stage { background:#fff; border:1px solid var(--line); border-radius:14px; overflow:hidden; }
    canvas { display:block; width:100%; height:auto; }
    .status { display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-top:8px; font-size:14px; color:var(--muted); }
    .status b { color:var(--ink); }
    .prog { height:4px; background:var(--line); border-radius:2px; margin-top:6px; overflow:hidden; }
    .prog i { display:block; height:100%; width:0; background:var(--accent); }
    .hint { font-size:13px; color:var(--muted); margin-top:12px; }
    kbd { border:1px solid var(--line); border-bottom-width:2px; border-radius:5px; padding:0 5px; font-size:12px; }
    /* ⛶ toàn màn hình: khung hoạt hình chiếm cả màn hình, nền trắng, thanh trạng thái nhỏ ở dưới */
    #wrap:fullscreen { background:#fff; display:flex; flex-direction:column; justify-content:center; align-items:center; padding:2vh 2vw; }
    #wrap:fullscreen .stage { border:0; border-radius:0; width:min(96vw, calc(88vh * 800 / 240)); }
    #wrap:fullscreen .prog { width:min(96vw, calc(88vh * 800 / 240)); background:#e5e5e5; }
    #wrap:fullscreen .prog i { background:#1e7daf; }
    #wrap:fullscreen .status { width:min(96vw, calc(88vh * 800 / 240)); color:#888; font-size:clamp(13px, 1.6vh, 20px); }
    #wrap:fullscreen .status b { color:#222; }
    #wrap:fullscreen { cursor:none; }
    #wrap:fullscreen.mouse { cursor:auto; }
  </style>
</head>
<body>
<script src="../assets/ui.js" data-section="Tiếng Trung" data-title="Chữ Hán chuyển động"></script>
<main>
  <h1>🎞️ Chữ Hán chuyển động</h1>
  <p class="sub">Câu chuyện hiện từng cụm, rồi chữ Hán to. Mỗi chữ lặp lại số lần bạn chọn rồi tự chuyển sang chữ tiếp theo.</p>

  <div class="bar">
    <select id="range" title="Chọn phần">
      <option value="all">Tất cả</option>
      <option value="t1">Tập 1</option><option value="t2">Tập 2</option><option value="t3">Tập 3</option>
      <option value="HSK1">HSK1</option><option value="HSK2">HSK2</option><option value="HSK3">HSK3</option>
      <option value="HSK4">HSK4</option><option value="HSK5">HSK5</option><option value="HSK6">HSK6</option><option value="HSK7">HSK7–9</option>
    </select>
    <input id="q" type="search" placeholder="Số thẻ hoặc chữ" title="Nhảy tới thẻ (số thẻ hoặc chữ Hán), Enter">
    <label>Lặp <input id="rep" type="number" min="1" max="50" value="3"> lần</label>
    <label>Tốc độ
      <select id="speed"><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select>
    </label>
  </div>
  <div class="bar">
    <button class="btn" id="prev" title="Chữ trước (←)">⏮ Trước</button>
    <button class="btn primary" id="play" title="Phát / dừng (Space)">⏸ Dừng</button>
    <button class="btn" id="next" title="Chữ sau (→)">Sau ⏭</button>
    <button class="btn" id="again" title="Phát lại chữ này (R)">↺ Lại</button>
    <button class="btn" id="fs" title="Toàn màn hình (F)">⛶ Toàn màn hình</button>
  </div>

  <div id="wrap">
  <div class="stage"><canvas id="cv" width="800" height="240" aria-label="Hoạt hình câu chuyện chữ Hán"></canvas></div>
  <div class="prog"><i id="bar"></i></div>
  <div class="status">
    <span id="where"></span>
    <span id="loop"></span>
  </div>
  </div>
  <p class="hint"><kbd>Space</kbd> phát/dừng · <kbd>←</kbd> <kbd>→</kbd> chữ trước/sau · <kbd>R</kbd> phát lại · <kbd>F</kbd> toàn màn hình (bấm vào hình để phát/dừng). Chỉ gồm các chữ đã có câu chuyện.</p>
</main>

<script src="hanzi-cards.js"></script>
<script src="hanzi-anim-crop.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const CROP = window.HANZI_ANIM_CROP || {};
  // [số thẻ, tập, chữ, phồn thể, pinyin, HSK, Hán Việt, nghĩa, câu chuyện, …]
  const ALL = (window.HANZI || []).filter(r => String(r[8] || '').trim())
    .map(r => ({ n: r[0], tap: r[1], k: r[2], t: r[3] && r[3] !== r[2] ? r[3] : '', py: r[4], hv: r[6],
                 m: String(r[7] || '').replace(/^./, c => c.toUpperCase()), j: [r[4], r[5]].filter(Boolean).join(' · '), s: r[8] }));

  const W = 800, H = 240, DUR = 5.0;
  const INK = [35, 35, 35], TEAL = [30, 125, 175], RED = [185, 35, 40], MUTED = [120, 120, 120];
  const VI = 'italic 700 SIZEpx "Avenir Next", "Helvetica Neue", Arial, sans-serif';
  const VIM = '500 SIZEpx "Avenir Next", "Helvetica Neue", Arial, sans-serif';
  const CJK = '500 SIZEpx "Hiragino Sans GB", "Hiragino Sans", "PingFang SC", "Noto Sans CJK JP", "Noto Sans JP", "Yu Gothic", sans-serif';
  const isCjk = c => c.codePointAt(0) >= 0x2E80;
  const ease = t => { t = Math.max(0, Math.min(1, t)); return 1 - Math.pow(1 - t, 3); };
  const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
  const PUNCT = /^[.,;:!?…]+$/;

  // ---- canvas sắc nét trên màn hình retina
  const cv = $('cv'), ctx = cv.getContext('2d');
  // độ phân giải canvas theo kích thước đang hiển thị (sắc nét cả khi toàn màn hình)
  function fit() {
    const k = Math.max(1, Math.min(4, (cv.clientWidth || W) * (window.devicePixelRatio || 1) / W));
    if (Math.abs(cv.width - W * k) > 1) { cv.width = Math.round(W * k); cv.height = Math.round(H * k); }
    ctx.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
  }
  fit();
  window.addEventListener('resize', fit);

  // ---- lưu lựa chọn (chỉ cho tiện, không bắt buộc)
  const store = {
    get(k, d) { try { const v = localStorage.getItem('hanziAnim.' + k); return v == null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('hanziAnim.' + k, v); } catch (e) {} },
  };
  $('rep').value = store.get('rep', '3');
  $('speed').value = store.get('speed', '1');
  $('range').value = store.get('range', 'all');

  let list = [], idx = 0, loop = 0, t = 0, playing = true, last = 0;
  let card = null, img = null, lines = null, size = 28, nch = 1, picBox = null;

  function buildList() {
    const r = $('range').value;
    list = ALL.filter(x => r === 'all' ? true : r[0] === 't' ? 't' + x.tap === r : x.j.endsWith(r));
  }

  // 'Bị 1 (一) cái đinh (丁) …' -> các cụm hiện lần lượt
  function chunks(story) {
    const out = []; let buf = [];
    for (const m of story.matchAll(/\(([^)]*)\)|[^\s()]+/g)) {
      if (m[1] !== undefined) { out.push([buf.join(' '), m[1].trim()]); buf = []; }
      else buf.push(m[0]);
    }
    if (buf.length) out.push([buf.join(' '), null]);
    return out;
  }
  function wordW(w, sz) {
    ctx.font = VI.replace('SIZE', sz);
    let s = 0; for (const c of w) s += isCjk(c) ? sz : ctx.measureText(c).width; return s;
  }
  function layout(ch, maxw, sz) {
    const items = [];
    ch.forEach(([txt, k], i) => {
      const ws = txt.split(/\s+/).filter(Boolean);
      ws.forEach((w, j) => items.push({ w, col: (k && j === ws.length - 1) ? TEAL : INK, ci: i, glue: PUNCT.test(w) }));
      if (k) items.push({ w: '(' + k + ')', col: RED, ci: i, glue: true, han: true });
    });
    ctx.font = VI.replace('SIZE', sz);
    const sp = ctx.measureText(' ').width;
    const out = []; let cur = [], cw = 0;
    for (const it of items) {
      it.len = wordW(it.w, sz);
      const gap = !cur.length ? 0 : it.glue ? (PUNCT.test(it.w) ? 0 : sp * 0.4) : sp;
      if (cur.length && cw + gap + it.len > maxw && !it.glue) { out.push({ items: cur, w: cw }); cur = []; cw = 0; it.gap = 0; cw = it.len; }
      else { it.gap = gap; cw += gap + it.len; }
      cur.push(it);
    }
    out.push({ items: cur, w: cw });
    return out;
  }

  function load(i) {
    if (!list.length) return;
    idx = (i + list.length) % list.length; loop = 0; t = 0;
    card = list[idx];
    picBox = CROP[card.n] || null;
    img = null;
    if (picBox) {
      const im = new Image();
      im.onload = () => { if (card && list[idx] === card) img = im; };
      im.src = 'story/' + String(card.n).padStart(4, '0') + '.webp';
    }
    // xếp chữ: bên phải tranh (hoặc cả khung nếu thẻ không có tranh)
    const ch = chunks(card.s); nch = Math.max(1, ch.length);
    const pw = picW();
    const x0 = pw ? 14 + pw + 26 : 40, x1 = W - 18;
    for (size of [30, 27, 24, 22, 20, 18]) {
      lines = layout(ch, x1 - x0, size);
      if (lines.length * size * 1.55 <= H - 30) break;
    }
    lines.x0 = x0; lines.x1 = x1;
    const nx = list[(idx + 1) % list.length];   // tải trước ảnh kế tiếp
    if (CROP[nx.n]) new Image().src = 'story/' + String(nx.n).padStart(4, '0') + '.webp';
    $('q').value = '';
    status();
  }
  function picW() {
    if (!picBox) return 0;
    const [a, b, c, d] = picBox, ph = H - 28;
    return Math.min(330, Math.round((c - a) * ph / (d - b)));
  }

  function drawText(c, x, y, w, col, a, sz, pop) {
    ctx.fillStyle = rgba(col, a);
    for (const ch of w) {
      if (isCjk(ch)) {
        const s = sz * pop;
        ctx.font = CJK.replace('SIZE', s);
        const m = ctx.measureText(ch);
        ctx.fillText(ch, x + (sz - m.width) / 2, y + sz * 0.02 + (s - sz) / 2);
        x += sz;
      } else {
        ctx.font = VI.replace('SIZE', sz);
        ctx.fillText(ch, x, y);
        x += ctx.measureText(ch).width;
      }
    }
  }

  function draw() {
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
    if (!card) return;
    ctx.textBaseline = 'top';
    // 1) tranh: hiện dần + phóng nhẹ; cuối clip nhún nhẹ
    if (picBox && img) {
      const [a, b, c, d] = picBox, pw = picW(), ph = Math.round(pw * (d - b) / (c - a));
      const al = ease(t / 0.6);
      let sc = 0.92 + 0.08 * al;
      if (t > 3.4) sc += 0.025 * Math.sin((t - 3.4) * 9) * Math.max(0, 1 - (t - 3.4) / 1.2);
      const w = pw * sc, h = ph * sc;
      ctx.globalAlpha = al;
      ctx.drawImage(img, a, b, c - a, d - b, 14 + (pw - w) / 2, (H - h) / 2, w, h);
      ctx.globalAlpha = 1;
    }
    // 2) câu chuyện hiện từng cụm
    const tBig = 3.55;
    const fade = t > tBig ? 1 - ease((t - tBig) / 0.35) : 1;
    if (fade > 0) {
      const lh = size * 1.55;
      let y = (H - lh * lines.length) / 2 + 2;
      for (const ln of lines) {
        let x = lines.x0 + (lines.x1 - lines.x0 - ln.w) / 2;
        for (const it of ln.items) {
          x += it.gap;
          const ts = 0.6 + 2.8 * it.ci / nch;
          const a = ease((t - ts) / 0.3) * fade;
          if (a > 0) {
            const pop = it.han && t > ts + 0.15 ? 1 + 0.45 * Math.max(0, 1 - (t - ts - 0.15) / 0.3) : 1;
            drawText(ctx, x, y, it.w, it.col, a, size, pop);
          }
          x += it.len;
        }
        y += lh;
      }
    }
    // 3) chữ Hán to (+ phồn thể) + âm Hán Việt + nghĩa + pinyin · HSK
    if (t > tBig) {
      const a = ease((t - tBig) / 0.45);
      const cx = (lines.x0 + lines.x1) / 2;
      const big = Math.round(120 * (0.6 + 0.4 * a));
      ctx.textBaseline = 'middle'; ctx.textAlign = 'center';
      ctx.font = CJK.replace('SIZE', big); ctx.fillStyle = rgba(RED, a);
      ctx.fillText(card.k, cx - 150, H / 2);
      if (card.t) { ctx.font = CJK.replace('SIZE', 30); ctx.fillStyle = rgba(MUTED, a); ctx.fillText('(' + card.t + ')', cx - 150, H / 2 + 78); }
      ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      ctx.font = VI.replace('SIZE', 40); ctx.fillStyle = rgba(TEAL, a);
      ctx.fillText(card.hv, cx - 60, H / 2 - 48);
      ctx.font = VIM.replace('SIZE', 22); ctx.fillStyle = rgba(INK, a);
      let m = card.m; while (ctx.measureText(m).width > lines.x1 - cx + 50 && m.length > 4) m = m.slice(0, -2);
      if (m !== card.m) m = m.trimEnd() + '…';
      ctx.fillText(m, cx - 60, H / 2 + 6);
      if (card.j) { ctx.font = VIM.replace('SIZE', 16); ctx.fillStyle = rgba(MUTED, a); ctx.fillText(card.j, cx - 60, H / 2 + 38); }
    }
  }

  function status() {
    if (!card) { $('where').textContent = 'Không có chữ nào'; return; }
    const rep = Math.max(1, +$('rep').value || 1);
    $('where').innerHTML = `<b>${card.k}</b>${card.t ? ' (' + card.t + ')' : ''} ${card.hv} · thẻ ${card.n} · ${idx + 1}/${list.length}`;
    $('loop').textContent = `Lần ${Math.min(loop + 1, rep)}/${rep}`;
  }

  function frame(now) {
    const dt = last ? (now - last) / 1000 : 0; last = now;
    if (playing && card) {
      t += dt * (+$('speed').value || 1);
      if (t >= DUR) {
        t = 0; loop++;
        if (loop >= Math.max(1, +$('rep').value || 1)) { load(idx + 1); }
        status();
      }
    }
    draw();
    $('bar').style.width = card ? (100 * t / DUR) + '%' : '0';
    requestAnimationFrame(frame);
  }

  function setPlaying(p) { playing = p; $('play').textContent = p ? '⏸ Dừng' : '▶ Phát'; }
  function jump(q) {
    q = q.trim(); if (!q) return;
    const i = /^\d+$/.test(q) ? list.findIndex(x => x.n >= +q) : list.findIndex(x => x.k === q);
    if (i >= 0) { load(i); setPlaying(true); }
    else { $('q').value = ''; $('q').placeholder = 'Không có trong phần này'; }
  }

  const wrap = $('wrap');
  function toggleFs() {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (wrap.requestFullscreen) wrap.requestFullscreen().catch(() => {});
    else if (wrap.webkitRequestFullscreen) wrap.webkitRequestFullscreen();   // Safari iOS cũ
  }
  document.addEventListener('fullscreenchange', () => {
    $('fs').textContent = document.fullscreenElement ? '✕ Thoát toàn màn hình' : '⛶ Toàn màn hình';
    setTimeout(fit, 50);
  });
  let mouseT = 0;   // toàn màn hình: ẩn con trỏ khi không di chuột
  wrap.addEventListener('mousemove', () => { wrap.classList.add('mouse'); clearTimeout(mouseT); mouseT = setTimeout(() => wrap.classList.remove('mouse'), 2000); });
  cv.addEventListener('click', () => setPlaying(!playing));
  cv.addEventListener('dblclick', toggleFs);
  $('fs').onclick = toggleFs;
  $('play').onclick = () => setPlaying(!playing);
  $('next').onclick = () => load(idx + 1);
  $('prev').onclick = () => load(idx - 1);
  $('again').onclick = () => { t = 0; loop = 0; status(); setPlaying(true); };
  $('rep').onchange = () => { store.set('rep', $('rep').value); status(); };
  $('speed').onchange = () => store.set('speed', $('speed').value);
  $('range').onchange = () => { store.set('range', $('range').value); buildList(); load(0); };
  $('q').onkeydown = e => { if (e.key === 'Enter') jump($('q').value); };
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    if (e.key === ' ') { e.preventDefault(); setPlaying(!playing); }
    else if (e.key === 'ArrowRight') load(idx + 1);
    else if (e.key === 'ArrowLeft') load(idx - 1);
    else if (e.key === 'r' || e.key === 'R') $('again').onclick();
    else if (e.key === 'f' || e.key === 'F') toggleFs();
  });

  buildList();
  const fromHash = decodeURIComponent(location.hash.slice(1));
  const saved = +store.get('card', 0);
  let start = fromHash ? list.findIndex(x => x.k === fromHash || String(x.n) === fromHash) : list.findIndex(x => x.n === saved);
  load(Math.max(0, start));
  setInterval(() => card && store.set('card', card.n), 3000);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
