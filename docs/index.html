<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Giải thích ngữ pháp tiếng anh</title>

  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Grammar Book">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, viewport-fit=cover">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#047857">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ngữ Pháp Anh">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">

  <!-- Theme -->
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">

  <style>
/* nền ảnh giữ nguyên */
body {
  background-image: url('cover.png');
  background-size: contain;
  background-position: center;
  background-repeat: no-repeat;
  background-color: #e5e5e5;
}

/* giảm độ trắng overlay → thấy ảnh rõ hơn */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(255,255,255,0.4); /* 👈 giảm từ 0.7 → 0.4 */
  z-index: -1;
}

/* nền content rõ hơn */
.markdown-section {
  background: rgba(255,255,255,0.9); /* 👈 tăng contrast */
  padding: 24px;
  border-radius: 12px;
}

/* tiêu đề đậm hơn */
.markdown-section h1,
.markdown-section h2 {
  color: #111827;
  font-weight: 700;
}

/* link rõ hơn (fix màu xanh nhạt) */
.markdown-section a {
  color: #047857; /* xanh đậm hơn */
  font-weight: 600;
}

.markdown-section a:hover {
  color: #047857;
}

/* sidebar rõ hơn */
.sidebar {
  background: rgba(255,255,255,0.95);
}

/* text sidebar */
.sidebar a {
  color: #374151;
}

.sidebar a:hover {
  color: #047857;
}

/* TOEIC reading: nút xem đáp án dưới mỗi câu hỏi */
.markdown-section details.ans {
  margin: 0.4em 0 1.4em;
  border: 1px solid #a7f3d0;
  border-radius: 8px;
  background: #f0fdf4;
}
.markdown-section details.ans > summary {
  cursor: pointer;
  padding: 0.35em 0.8em;
  font-weight: 600;
  color: #047857;
  user-select: none;
}
.markdown-section details.ans[open] > summary {
  border-bottom: 1px solid #a7f3d0;
}
.markdown-section details.ans .ans-line {
  padding: 0.3em 0.9em;
  line-height: 1.6;
}

/* TOEIC listening transcripts: preserve intentional line breaks. */
.markdown-section .transcript {
  white-space: pre-line;
  margin: 1em 0 1.25em;
  padding: 1em 1.1em;
  border-left: 4px solid #047857;
  border-radius: 0 8px 8px 0;
  background: #f0fdf4;
  line-height: 1.75;
}
</style>
</head>

<body>
  <div id="app">Loading...</div>

  <script>
    // Old/shared links like #/jlpt-vocab/index.html: open the real tool page
    // instead of letting docsify load the HTML file as markdown.
    (function(){
      function go(){
        var m = location.hash.match(/^#\/(.+?\.html)(\?.*)?$/);
        if (m) location.replace(m[1]);
      }
      go(); window.addEventListener('hashchange', go);
    })();
  </script>

  <script>
    window.$docsify = {
      name: '📚Giải thích ngữ pháp tiếng anh',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 0,
      maxLevel: 0,
      auto2top: true,
      // Link tới công cụ HTML / file tham khảo .xlsx: điều hướng thẳng,
      // không cho router SPA của docsify nuốt vào rồi tải như markdown.
      noCompileLinks: ['.*\\.html(\\?.*)?$', '.*\\.xlsx$', '.*\\.mp3$']
    }
  </script>

  <!-- Docsify -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>

  <!-- 🔊 buttons in markdown pages: <button class="say-btn" data-lang="zh-CN" data-t="...">🔊</button> -->
  <style>
    .markdown-section .say-btn{border:1px solid #d6d3d1;background:#fff;border-radius:8px;padding:2px 8px;cursor:pointer;font-size:14px;line-height:1.4}
    .markdown-section .say-btn:hover{border-color:#047857}
    .markdown-section .say-btn.playing{background:#ecfdf5;border-color:#047857}
  </style>
  <script>
    (function(){
      if (!('speechSynthesis' in window)) return;
      var cache = {};
      function voiceFor(lang){
        if (cache[lang]) return cache[lang];
        var p = lang.slice(0,2).toLowerCase(), vs = speechSynthesis.getVoices();
        cache[lang] = vs.find(function(v){ return v.lang.replace('_','-').toLowerCase() === lang.toLowerCase(); }) ||
                      vs.find(function(v){ return v.lang.toLowerCase().indexOf(p) === 0; }) || null;
        return cache[lang];
      }
      speechSynthesis.onvoiceschanged = function(){ cache = {}; };
      document.addEventListener('click', function(e){
        var b = e.target.closest && e.target.closest('.say-btn'); if (!b) return;
        e.preventDefault();
        speechSynthesis.cancel();
        document.querySelectorAll('.say-btn.playing').forEach(function(x){ x.classList.remove('playing'); });
        var lang = b.getAttribute('data-lang') || 'zh-CN';
        var u = new SpeechSynthesisUtterance(b.getAttribute('data-t') || '');
        u.lang = lang; var v = voiceFor(lang); if (v) u.voice = v; u.rate = 0.85;
        b.classList.add('playing'); u.onend = u.onerror = function(){ b.classList.remove('playing'); };
        speechSynthesis.speak(u);
      });
    })();
  </script>

  <!-- PWA: register service worker for offline support -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
