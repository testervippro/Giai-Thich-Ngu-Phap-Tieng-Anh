<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">

<title>Quiz HSK 1-4</title>
<style>
:root{
  --bg:#faf9f7; --card:#fff; --ink:#1c1917; --dim:#78716c; --line:#e7e5e4;
  --accent:#b45309; --accentbg:#fffbeb;
  --good:#15803d; --goodbg:#dcfce7; --bad:#b91c1c; --badbg:#fee2e2;
}
@media(prefers-color-scheme:dark){:root:not([data-t=light]){
  --bg:#1c1917; --card:#292524; --ink:#f5f5f4; --dim:#a8a29e; --line:#44403c;
  --accent:#fbbf24; --accentbg:#2a2115;
  --good:#4ade80; --goodbg:#052e16; --bad:#f87171; --badbg:#450a0a;
}}
*{box-sizing:border-box}
body{margin:0;padding:14px;background:var(--bg);color:var(--ink);
  font-family:-apple-system,system-ui,"Segoe UI",sans-serif;
  display:flex;flex-direction:column;align-items:center;min-height:100vh}
.wrap{max-width:520px;width:100%}
h1{font-size:17px;margin:0 0 12px;text-align:center}
.row{display:flex;gap:8px;margin-bottom:10px}
select{flex:1;padding:9px;border:1px solid var(--line);border-radius:9px;
  background:var(--card);color:inherit;font:inherit;font-size:13px}
.stats{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);
  margin-bottom:8px;padding:0 2px}
.prog{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:14px}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:28px 16px;text-align:center;margin-bottom:14px}
.hanzi{font-size:64px;font-weight:700;line-height:1.1;margin-bottom:6px}
.pinyin{font-size:16px;color:var(--dim);min-height:22px}
.qlabel{font-size:13px;color:var(--dim);margin-top:10px}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{padding:13px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);
  color:inherit;font:inherit;font-size:15px;text-align:left;cursor:pointer;
  transition:background .15s,border-color .15s}
.opt:active{transform:scale(.98)}
.opt.correct{background:var(--goodbg);border-color:var(--good);color:var(--good);font-weight:700}
.opt.wrong{background:var(--badbg);border-color:var(--bad);color:var(--bad);font-weight:700}
.opt:disabled{cursor:default}
.footer{display:flex;gap:8px;margin-top:14px}
.footer button{flex:1;padding:11px;border:1px solid var(--line);border-radius:9px;
  background:var(--card);color:inherit;font:inherit;font-size:14px;cursor:pointer}
.footer button.primary{background:var(--accentbg);border-color:var(--accent);color:var(--accent);font-weight:700}
.footer button:disabled{opacity:.4;cursor:default}
.done{text-align:center;padding:30px 10px}
.done .big{font-size:40px;margin-bottom:8px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Quiz HSK 1-4</h1>
  <div class="row">
    <select id="levelSel">

      <option value="HSK4">HSK4</option>

      <option value="hanviet">Đoán Hán Việt</option>

  </div>
  <div class="stats">

    <span id="statScore">Đúng: 0 · Sai: 0</span>

  <div class="prog"><i id="bar"></i></div>

      <div class="pinyin" id="pinyinLine"></div>
      <div class="qlabel" id="qlabel"></div>
    </div>
    <div class="opts" id="opts"></div>
  </div>

  <div id="doneArea" style="display:none" class="done">
    <div class="big">🎉</div>
    <div id="doneText"></div>
  </div>

  <div class="footer">
    <button id="restartBtn">🔄 Làm lại</button>
    <button id="nextBtn" class="primary" disabled>Câu tiếp →</button>
  </div>
</div>

 "nghia": "tự tin"}, {"cap": "HSK4", "word": "总结", "pinyin": "zǒng jié", "han_viet": "TỔNG KẾT", "nghia": "tổng kết"}, {"cap": "HSK4", "word": "租", "pinyin": "zū", "han_viet": "TÔ", "nghia": "thuê"}, {"cap": "HSK4", "word": "最好", "pinyin": "zuì hǎo", "han_viet": "TỐI HẢO", "nghia": "tốt nhất"}, {"cap": "HSK4", "word": "尊重", "pinyin": "zūn zhòng", "han_viet": "TÔN TRỌNG", "nghia": "tôn trọng"}, {"cap": "HSK4", "word": "左右", "pinyin": "zuǒ yòu", "han_viet": "TẢ HỮU", "nghia": "khoảng"}, {"cap": "HSK4", "word": "作家", "pinyin": "zuò jiā", "han_viet": "TÁC GIA", "nghia": "tác gia"}, {"cap": "HSK4", "word": "作者", "pinyin": "zuò zhě", "han_viet": "TÁC GIẢ", "nghia": "tác giả"}, {"cap": "HSK4", "word": "座", "pinyin": "zuò", "han_viet": "TOẠ", "nghia": "tòa"}, {"cap": "HSK4", "word": "座位", "pinyin": "zuò wèi", "han_viet": "TOẠ VỊ", "nghia": "chỗ ngồi"}];
let pool = [];
let idx = 0;
let correct = 0, wrong = 0;
let answered = false;
let missed = [];

init();

function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function fieldFor(mode){
  if (mode === 'pinyin') return 'pinyin';
  if (mode === 'hanviet') return 'han_viet';
  return 'nghia';
}

function labelFor(mode){
  if (mode === 'pinyin') return 'Phiên âm của chữ này là gì?';
  if (mode === 'hanviet') return 'Âm Hán Việt của chữ này là gì?';
  return 'Nghĩa của chữ này là gì?';
}

function init(){
  const level = $('levelSel').value;
  const mode = $('modeSel').value;
  const src = level === 'all' ? ALL : ALL.filter(x => x.cap === level);
  pool = shuffle(src);
  idx = 0; correct = 0; wrong = 0; answered = false; missed = [];
  $('quizArea').style.display = '';
  $('doneArea').style.display = 'none';
  render();
}

function render(){
  if (idx >= pool.length){
    finish();
    return;
  }
  answered = false;
  $('nextBtn').disabled = true;
  const mode = $('modeSel').value;
  const field = fieldFor(mode);
  const item = pool[idx];
  $('hanzi').textContent = item.word;
  $('pinyinLine').textContent = mode === 'pinyin' ? '' : item.pinyin;
  $('qlabel').textContent = labelFor(mode);
  $('statPos').textContent = (idx + 1) + ' / ' + pool.length;
  $('statScore').textContent = 'Đúng: ' + correct + ' · Sai: ' + wrong;
  $('bar').style.width = (idx / pool.length * 100) + '%';

  const correctVal = item[field];
  const distractorsPool = ALL.filter(x => x !== item && x[field] && x[field] !== correctVal);
  const distractors = shuffle(distractorsPool).slice(0, 3).map(x => x[field]);
  const options = shuffle([correctVal, ...distractors]);

  const optsDiv = $('opts');
  optsDiv.innerHTML = '';
  options.forEach(optVal => {
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.textContent = optVal;
    btn.addEventListener('click', () => selectAnswer(btn, optVal, correctVal, item));
    optsDiv.appendChild(btn);
  });
}

function selectAnswer(btn, chosen, correctVal, item){
  if (answered) return;
  answered = true;
  const isCorrect = chosen === correctVal;
  if (isCorrect){
    correct++;
    btn.classList.add('correct');
  } else {
    wrong++;
    btn.classList.add('wrong');
    missed.push(item);
    [...$('opts').children].forEach(b => {
      if (b.textContent === correctVal) b.classList.add('correct');
    });
  }
  [...$('opts').children].forEach(b => b.disabled = true);
  $('statScore').textContent = 'Đúng: ' + correct + ' · Sai: ' + wrong;
  $('nextBtn').disabled = false;
}

function finish(){
  $('bar').style.width = '100%';
  $('quizArea').style.display = 'none';
  $('doneArea').style.display = '';
  const total = correct + wrong;
  const pct = total ? Math.round(correct / total * 100) : 0;
  let html = 'Đúng ' + correct + '/' + total + ' (' + pct + '%)';
  if (missed.length){
    html += '<br><br><b>Từ cần ôn lại:</b><br>' +
      missed.map(m => m.word + ' (' + m.pinyin + ') — ' + m.nghia).join('<br>');
  }
  $('doneText').innerHTML = html;
  $('nextBtn').disabled = true;
}

$('nextBtn').addEventListener('click', () => { idx++; render(); });
$('restartBtn').addEventListener('click', init);
$('levelSel').addEventListener('change', init);
$('modeSel').addEventListener('change', init);
</script>
