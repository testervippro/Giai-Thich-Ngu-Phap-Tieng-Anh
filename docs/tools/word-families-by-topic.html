<script>
const TOPICS = JSON.parse(document.getElementById('data').textContent);
const totalWords = TOPICS.reduce((s,t)=>s+t.words.length,0);
document.getElementById('subtitle').textContent =
  TOPICS.length + ' chủ đề · ' + totalWords.toLocaleString('en-US') + ' từ. Bấm một chủ đề để lọc, hoặc gõ để tìm xuyên suốt tất cả.';

let activeTopic = null;

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function highlight(word, q){
  if (!q) return escapeHtml(word);
  const idx = word.toLowerCase().indexOf(q);
  if (idx === -1) return escapeHtml(word);
  return escapeHtml(word.slice(0,idx)) + '<mark>' + escapeHtml(word.slice(idx,idx+q.length)) + '</mark>' + escapeHtml(word.slice(idx+q.length));
}

function renderChips(){
  const chips = document.getElementById('chips');
  chips.innerHTML = '';
  const allChip = document.createElement('span');
  allChip.className = 'chip' + (activeTopic === null ? ' active' : '');
  allChip.textContent = 'Tất cả';
  allChip.onclick = () => { activeTopic = null; render(); };
  chips.appendChild(allChip);
  TOPICS.forEach((t, i) => {
    const c = document.createElement('span');
    c.className = 'chip' + (activeTopic === i ? ' active' : '');
    c.textContent = `${t.name} (${t.count})`;
    c.onclick = () => { activeTopic = (activeTopic === i ? null : i); render(); };
    chips.appendChild(c);
  });
}

function render(){
  renderChips();
  const q = document.getElementById('q').value.trim().toLowerCase();
  const main = document.getElementById('main');
  const list = activeTopic === null ? TOPICS : [TOPICS[activeTopic]];
  let html = '';
  let shown = 0;
  list.forEach(t => {
    const words = q ? t.words.filter(w => w.toLowerCase().includes(q)) : t.words;
    if (!words.length) return;
    shown += words.length;
    html += `<div class="section-title">${escapeHtml(t.name)} <span class="cnt">${words.length}${q ? ' / ' + t.words.length : ''} từ</span></div>`;
    html += '<div class="wordwrap">' + words.map(w => `<span class="w">${highlight(w, q)}</span>`).join('') + '</div>';
  });
  if (!html){
    html = '<div class="empty">Không tìm thấy từ nào khớp.</div>';
  }
  main.innerHTML = html;
}

document.getElementById('q').addEventListener('input', render);
render();
</script>
