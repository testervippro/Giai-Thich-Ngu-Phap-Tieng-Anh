<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
let filtered = DATA;

function norm(s){ return (s||'').toLowerCase(); }

function matches(entry, q, posf){
  if (posf && !norm(entry.pos||'').includes(posf)) return false;
  if (!q) return true;
  if (norm(entry.w).includes(q)) return true;
  for (const k of ['syn','noun','verb','adj']){
    if (entry[k] && norm(entry[k]).includes(q)) return true;
  }
  return false;
}

function render(){
  const grid = document.getElementById('grid');
  const countEl = document.getElementById('count');
  countEl.textContent = filtered.length.toLocaleString('en-US') + ' / ' + DATA.length.toLocaleString('en-US') + ' từ';

  if (!filtered.length){
    grid.innerHTML = '<div class="empty">Không tìm thấy từ nào.</div>';
  } else {
    grid.innerHTML = filtered.map(e => {
      let rows = '';
      if (e.syn) rows += `<div class="row"><span class="label syn">≈</span>${escapeHtml(e.syn)}</div>`;
      if (e.noun) rows += `<div class="row"><span class="label n">n.</span>${escapeHtml(e.noun)}</div>`;
      if (e.verb) rows += `<div class="row"><span class="label v">v.</span>${escapeHtml(e.verb)}</div>`;
      if (e.adj) rows += `<div class="row"><span class="label adj">adj.</span>${escapeHtml(e.adj)}</div>`;
      return `<div class="card"><span class="word">${escapeHtml(e.w)}</span><span class="pos">${escapeHtml(e.pos||'')}</span>${rows}</div>`;
    }).join('');
  }
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function applyFilter(){
  const q = norm(document.getElementById('q').value.trim());
  const posf = document.getElementById('posFilter').value;
  filtered = DATA.filter(e => matches(e, q, posf));
  render();
}

document.getElementById('q').addEventListener('input', applyFilter);
document.getElementById('posFilter').addEventListener('change', applyFilter);
render();
</script>
