<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mind map Kanji</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif; }
    main { max-width:1180px; margin:auto; padding:4px 16px 40px; }
    h1 { margin:0 0 8px; font-size:22px; }
    .bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:10px; }
    input[type=search] { padding:8px 10px; border:1px solid var(--line); border-radius:9px; background:var(--card); color:inherit; font:inherit; flex:1; min-width:180px; }
    .btn { border:1px solid var(--line); background:var(--card); color:inherit; border-radius:9px; padding:8px 12px; font:inherit; font-size:14px; cursor:pointer; }
    .btn:disabled { opacity:.45; cursor:default; }
    .hint { color:var(--muted); font-size:13px; }
    .wrap { position:relative; overflow:auto; border:1px solid var(--line); border-radius:14px; background:var(--card); }
    .map { position:relative; margin:0 auto; }
    .map svg { position:absolute; inset:0; overflow:visible; pointer-events:none; }
    .map path { fill:none; stroke-width:2; opacity:.55; }
    .node { position:absolute; transform:translate(-50%,-50%); border:1.5px solid var(--line); background:var(--bg); color:inherit; border-radius:12px; padding:4px 10px; cursor:pointer; white-space:nowrap; text-align:center; font:inherit; line-height:1.15; transition:box-shadow .15s; }
    .node:hover { box-shadow:0 2px 10px rgba(0,0,0,.12); }
    .node .k { font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif; font-size:22px; display:block; }
    .node .t { font-size:11.5px; font-weight:700; color:var(--muted); display:block; }
    .node .m { font-size:11px; color:var(--muted); display:block; max-width:150px; overflow:hidden; text-overflow:ellipsis; }
    .node.center { padding:8px 18px; border-width:2.5px; border-color:var(--accent); }
    .node.center .k { font-size:52px; }
    .node.center .t { font-size:15px; color:var(--accent); }
    .node.part { border-color:#d97706; }
    .node.word { border-color:#2563eb; }
    .node.sub { border-style:dashed; }
    .node.more { font-size:12.5px; color:var(--muted); border-style:dashed; }
    .node.sel { box-shadow:0 0 0 3px var(--accentbg); outline:2px solid var(--accent); }
    .node b.hl { color:var(--accent); font-weight:inherit; }
    .label { position:absolute; transform:translate(-50%,-50%); font-size:12px; font-weight:800; letter-spacing:.3px; text-transform:uppercase; }
    .info { margin-top:12px; padding:12px 14px; border:1px solid var(--line); border-left:4px solid var(--accent); border-radius:12px; background:var(--card); min-height:64px; }
    .info .big { font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif; font-size:40px; line-height:1; margin-right:12px; float:left; }
    .info .hv { font-weight:800; color:var(--accent); font-size:17px; }
    .info .s { color:var(--muted); margin-top:3px; }
    .info .acts { clear:both; display:flex; gap:6px; flex-wrap:wrap; padding-top:8px; }
    .hidden { display:none !important; }
    .btn.on { border-color:var(--accent); background:var(--accentbg); color:var(--accent); font-weight:700; }
    .full { overflow-x:auto; padding:10px; border:1px solid var(--line); border-radius:14px; background:var(--card); }
    .full .g { margin:0 0 6px; }
    .tr { display:flex; align-items:center; }
    .kids { display:flex; flex-direction:column; gap:3px; margin-left:16px; padding-left:14px; border-left:2px solid #f0c48a; position:relative; }
    .kids > .tr, .kids > .lv { position:relative; }
    .kids > .tr::before, .kids > .lv::before { content:""; position:absolute; left:-14px; top:50%; width:12px; border-top:2px solid #f0c48a; }
    .lv { display:flex; flex-wrap:wrap; gap:3px; max-width:720px; }
    .n { border:1.5px solid var(--line); background:var(--bg); color:inherit; border-radius:8px; padding:1px 6px; font:inherit; cursor:pointer; line-height:1.1; text-align:center; min-width:38px; }
    .n .k { font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif; font-size:20px; display:block; }
    .n .t { font-size:9.5px; font-weight:700; color:var(--muted); display:block; white-space:nowrap; }
    .n.root { border-color:#d97706; border-width:2px; }
    .n.root .k { font-size:26px; }
    .n.piece { border-style:dashed; }
    .n.hit { outline:3px solid var(--accent); background:var(--accentbg); }
    .solo { display:flex; flex-wrap:wrap; gap:3px; }
    body.all .info { position:sticky; bottom:8px; box-shadow:0 4px 18px rgba(0,0,0,.15); }
    .legend { display:flex; gap:14px; flex-wrap:wrap; font-size:12.5px; color:var(--muted); margin:8px 2px 0; }
    .legend i { display:inline-block; width:12px; height:12px; border-radius:3px; border:2px solid; vertical-align:-2px; margin-right:4px; }
  </style>
<link rel="stylesheet" href="../assets/ui.css">
<script src="../assets/ui.js" data-section="Tiếng Nhật" data-title="Mind map Kanji"></script>
</head>
<body>
<main>
  <h1>🧠 Mind map Kanji</h1>
  <div class="bar">
    <button class="btn on" id="modeOne" title="Mind map của một chữ">🎯 Một chữ</button>
    <button class="btn" id="modeAll" title="Cả 2136 chữ trên một mind map">🌳 Toàn bộ 2136 chữ</button>
    <button class="btn" id="back" title="Chữ xem trước đó">← Quay lại</button>
    <input type="search" id="find" placeholder="Nhập chữ / Hán Việt / số thẻ rồi Enter (vd 肺, PHẾ, 584)" aria-label="Tìm chữ">
    <button class="btn" id="rand">🎲 Ngẫu nhiên</button>
    <a class="btn" id="write" href="write.html" style="text-decoration:none">✍️ Luyện viết chữ này</a>
  </div>
  <div class="wrap" id="oneWrap"><div class="map" id="map"></div></div>
  <div id="allWrap" class="hidden">
    <div class="hint" id="allHint" style="margin:0 2px 8px"></div>
    <div class="full" id="full"></div>
  </div>
  <div class="legend">
    <span><i style="border-color:#d97706"></i>🧩 Ghép từ: các mảnh câu chuyện nhắc tới, tách tới bộ gốc (bấm ⊖/⊕ thu/mở)</span>
    <span><i style="border-color:#2563eb"></i>➕ Ghép thành: các chữ có câu chuyện dùng chữ này (bấm ⊕ mở tiếp)</span>
    <span>Bấm 1 lần xem câu chuyện · bấm đúp đặt vào giữa</span>
  </div>
  <div class="info" id="info"></div>
</main>
<script src="kanji-game-data.js"></script>
<script src="kanji-roadmap.js"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const esc = t => String(t ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const cap = s => s ? s.charAt(0).toUpperCase() + s.slice(1) : '';
  const ALL = (window.KANJI || []).map(r => ({ n:r[0], k:r[1], hv:r[2], m:r[3], j:r[4], s:r[5] }));
  const BYK = new Map(); ALL.forEach(x => { if (!BYK.has(x.k) || (!BYK.get(x.k).s && x.s)) BYK.set(x.k, x); });
  const RADK = new Map(((window.ROADMAP || {}).radw || []).map(r => [r[0], { k:r[0], hv:r[1], m:r[2] }]));
  const CJK = /[⺀-⿟々゠-ヿ㐀-鿿豈-﫿]/g;

  const info = c => BYK.get(c) || RADK.get(c) || null;
  // các mảnh câu chuyện nhắc tới (bỏ chính nó)
  function parts(c){
    const x = BYK.get(c); if (!x || !x.s) return [];
    const seen = new Set([c]), out = [];
    (x.s.match(CJK) || []).forEach(p => { if (!seen.has(p)){ seen.add(p); out.push(p); } });
    return out;
  }
  // chữ nào có câu chuyện nhắc tới c (c được dùng để ghép thành chữ đó), theo thứ tự thẻ
  const USED = new Map();
  ALL.forEach(x => { if (!x.s) return; new Set(x.s.match(CJK) || []).forEach(p => { if (p === x.k) return; if (!USED.has(p)) USED.set(p, []); const a = USED.get(p); if (!a.includes(x.k)) a.push(x.k); }); });
  const usedIn = c => USED.get(c) || [];

  let center = null, hist = [], closed = new Set(), opened = new Set(), showAll = false, sel = null;

  function setCenter(c, push = true){
    if (!info(c)) return;
    if (push && center && center !== c) hist.push(center);
    center = c; closed = new Set(); opened = new Set(); showAll = false; sel = { v:'C', c };
    $('back').disabled = !hist.length;
    $('write').href = 'write.html#' + encodeURIComponent(c);
    try { history.replaceState(null, '', '#' + encodeURIComponent(c)); } catch {}
    render();
  }

  function render(){
    const map = $('map');
    // ---- trái: chữ được ghép từ đâu (theo câu chuyện), tách tiếp tới bộ gốc
    const left = [];
    const addParts = (c, depth, parent, anc) => parts(c).forEach(p => {
      if (anc.has(p)) return;                 // tránh vòng lặp A nhắc B, B nhắc A
      const id = parent + '>' + p;
      left.push({ id, c:p, depth, parent });
      if (!closed.has(id) && depth < 6) addParts(p, depth + 1, id, new Set([...anc, p]));
    });
    addParts(center, 1, 'C', new Set([center]));
    const maxL = left.reduce((m, o) => Math.max(m, o.depth), 0);
    // ---- phải: chữ này được dùng để ghép thành chữ nào (bấm để mở tiếp 1 tầng)
    const us = usedIn(center), LIM = 20;
    const right = [];
    (showAll ? us : us.slice(0, LIM)).forEach(c => {
      const id = 'U>' + c;
      right.push({ id, c, depth:1, parent:'C' });
      if (opened.has(id)) usedIn(c).slice(0, 12).forEach(c2 => { if (c2 !== center) right.push({ id:id + '>' + c2, c:c2, depth:2, parent:id }); });
    });
    if (us.length > LIM) right.push({ id:'MORE', more:true, depth:1, parent:'C' });
    const maxR = right.reduce((m, o) => Math.max(m, o.depth), 0);

    const ROW = 66, STEP = 165;
    const leaves = arr => arr.filter(o => !arr.some(q => q.parent === o.id)).length;
    const n = Math.max(leaves(left), leaves(right), 3);
    const W = Math.max($('map').parentElement.clientWidth - 2, 200 + (maxL + maxR) * STEP + 120);
    const H = Math.max(360, n * ROW + 70);
    const cx = Math.max(110 + maxL * STEP, Math.min(W / 2, W - 110 - maxR * STEP)), cy = H / 2;
    // cây gọn: mỗi lá 1 hàng, nút cha nằm giữa các con
    const place = (arr, side) => {
      const kids = new Map(); arr.forEach(o => { if (!kids.has(o.parent)) kids.set(o.parent, []); kids.get(o.parent).push(o); });
      let row = 0;
      const lay = id => { const ks = kids.get(id) || []; ks.forEach(o => { const cs = kids.get(o.id); if (cs && cs.length){ lay(o.id); o.r = (cs[0].r + cs[cs.length - 1].r) / 2; } else o.r = row++; }); };
      lay('C');
      const top = (kids.get('C') || []), mid = top.length ? (top[0].r + top[top.length - 1].r) / 2 : 0;
      arr.forEach(o => { o.y = cy + (o.r - mid) * ROW; o.x = cx + side * o.depth * STEP; });
    };
    place(left, -1); place(right, 1);
    const pos = new Map([['C', { x:cx, y:cy }]]);
    left.concat(right).forEach(o => pos.set(o.id, o));

    map.style.width = W + 'px'; map.style.height = H + 'px';
    const curve = (a, b, col) => { const mx = (a.x + b.x) / 2; return `<path d="M${a.x},${a.y} C${mx},${a.y} ${mx},${b.y} ${b.x},${b.y}" stroke="${col}"/>`; };
    let svg = `<svg width="${W}" height="${H}">`;
    left.forEach(o => svg += curve(pos.get(o.parent), o, '#d97706'));
    right.forEach(o => svg += curve(pos.get(o.parent), o, '#2563eb'));
    svg += '</svg>';

    const ci = info(center);
    const isSel = id => sel && sel.v === id ? ' sel' : '';
    const node = (o, cls, extra) => {
      const x = info(o.c);
      return `<button class="node ${cls}${isSel(o.id)}" data-id="${esc(o.id)}" data-k="${esc(o.c)}" title="${esc(x && x.s ? x.s : '')}" style="left:${o.x}px;top:${o.y}px"><span class="k">${esc(o.c)}${extra || ''}</span><span class="t">${esc(x ? x.hv : '')}</span><span class="m">${esc(x ? cap(x.m) : '')}</span></button>`;
    };
    let html = svg + `<button class="node center${isSel('C')}" data-id="C" data-k="${esc(center)}" style="left:${cx}px;top:${cy}px"><span class="k">${esc(center)}</span><span class="t">${esc(ci.hv)}</span><span class="m" style="font-size:13px;max-width:none">${esc(cap(ci.m))}</span></button>`;
    html += `<div class="label" style="left:${cx - STEP}px;top:${(left.length ? Math.min(...left.map(o => o.y)) : cy) - 40}px;color:#d97706">🧩 Ghép từ</div>`;
    if (right.length) html += `<div class="label" style="left:${cx + STEP}px;top:${Math.min(...right.map(o => o.y)) - 40}px;color:#2563eb">➕ Ghép thành (${us.length})</div>`;
    if (!left.length) html += `<div class="label" style="left:${cx - STEP}px;top:${cy}px;color:var(--muted);text-transform:none;font-weight:600">Chữ gốc — không tách nhỏ hơn</div>`;
    left.forEach(o => {
      const can = parts(o.c).length && o.depth < 6;
      html += node(o, 'part' + (o.depth > 1 ? ' sub' : ''), can ? ` <small style="font-size:13px;color:#d97706">${closed.has(o.id) ? '⊕' : '⊖'}</small>` : '');
    });
    right.forEach(o => {
      if (o.more){ html += `<button class="node more" data-more="1" style="left:${o.x}px;top:${o.y}px">${showAll ? 'Thu gọn' : `+${us.length - LIM} chữ nữa`}</button>`; return; }
      const can = o.depth === 1 && usedIn(o.c).some(c2 => c2 !== center);
      html += node(o, 'word' + (o.depth > 1 ? ' sub' : ''), can ? ` <small style="font-size:13px;color:#2563eb">${opened.has(o.id) ? '⊖' : '⊕'}</small>` : '');
    });
    map.innerHTML = html;

    map.querySelectorAll('.node').forEach(b => {
      b.onclick = () => {
        if (b.dataset.more){ showAll = !showAll; render(); return; }
        const id = b.dataset.id, c = b.dataset.k;
        sel = { v:id, c };
        if (id.startsWith('U>')){ if (id.split('>').length === 2 && usedIn(c).length) opened.has(id) ? opened.delete(id) : opened.add(id); }
        else if (id !== 'C' && parts(c).length) closed.has(id) ? closed.delete(id) : closed.add(id);
        render();
      };
      if (b.dataset.k) b.ondblclick = () => setCenter(b.dataset.k);
    });
    showInfo();
  }

  function showInfo(){
    const el = $('info');
    const c = (sel && sel.c) || center, x = info(c);
    if (!x){ el.innerHTML = ''; return; }
    const ps = parts(c);
    el.innerHTML = `<span class="big">${esc(c)}</span><div class="hv">${esc(x.hv)} <span style="font-weight:400;color:inherit">– ${esc(cap(x.m))}</span></div>
      <div class="s">${x.s ? '📖 ' + esc(x.s) : (BYK.has(c) ? '' : 'Mảnh ghép (bộ thủ / dạng biến thể)')}</div>
      ${ps.length ? `<div class="s">🧩 ${esc(c)} = ${ps.map(p => `${esc(p)} ${esc(info(p) ? info(p).hv : '')}`).join(' + ')}</div>` : ''}
      <div class="acts">${c !== center || mode === 'all' ? `<button class="btn" data-go="${esc(c)}">🎯 Mind map riêng của ${esc(c)}</button>` : ''}${BYK.has(c) ? `<a class="btn" style="text-decoration:none" href="write.html#${encodeURIComponent(c)}">✍️ Luyện viết ${esc(c)}</a>` : ''}</div>`;
    el.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { if (mode === 'all') setMode('one'); setCenter(b.dataset.go); window.scrollTo(0, 0); });
  }

  // ================= 🌳 Toàn bộ: rừng câu chuyện cho cả 2136 chữ =================
  // Mỗi chữ treo dưới mảnh "lớn nhất" (tầng sâu nhất) mà câu chuyện của nó nhắc tới,
  // nên đi từ gốc ra là thấy chữ được ghép dần lên: 二,日 → 車 → 重 → 動 → 働.
  let fullBuilt = false;
  function buildFull(){
    if (fullBuilt) return; fullBuilt = true;
    const DEP = new Map();
    const dep = (c, st) => { if (DEP.has(c)) return DEP.get(c); if (st.has(c)) return 0; st.add(c);
      const ps = parts(c); const d = ps.length ? 1 + Math.max(...ps.map(p => dep(p, st))) : 0; st.delete(c); DEP.set(c, d); return d; };
    const ks = [...BYK.keys()]; ks.forEach(k => dep(k, new Set()));
    const kids = new Map(), par = new Map();
    ks.forEach(k => { const ps = parts(k); if (!ps.length) return;
      const p = ps.reduce((a, b) => (DEP.get(b) || 0) > (DEP.get(a) || 0) ? b : a);
      par.set(k, p); if (!kids.has(p)) kids.set(p, []); kids.get(p).push(k); });
    const nodes = new Set(ks); par.forEach(p => nodes.add(p));
    const size = new Map(); const sz = c => { if (size.has(c)) return size.get(c); size.set(c, 1); const v = 1 + (kids.get(c) || []).reduce((t, k) => t + sz(k), 0); size.set(c, v); return v; };
    const roots = [...nodes].filter(n => !par.has(n)).sort((a, b) => sz(b) - sz(a));
    const btn = (c, cls) => { const x = info(c); return `<button class="n ${cls || ''}${BYK.has(c) ? '' : ' piece'}" data-k="${esc(c)}" title="${esc(x ? x.hv + ' – ' + cap(x.m) + (x.s ? '\n' + x.s : '') : '')}"><span class="k">${esc(c)}</span><span class="t">${esc(x ? x.hv : '')}</span></button>`; };
    const tree = (c, cls) => {
      const ch = (kids.get(c) || []).slice().sort((a, b) => sz(b) - sz(a));
      if (!ch.length) return btn(c, cls);
      const sub = ch.filter(k => kids.has(k)), leaf = ch.filter(k => !kids.has(k));
      return `<div class="tr">${btn(c, cls)}<div class="kids">${sub.map(k => `<div class="tr">${tree(k)}</div>`).join('')}${leaf.length ? `<div class="lv">${leaf.map(k => btn(k)).join('')}</div>` : ''}</div></div>`;
    };
    const big = roots.filter(r => kids.has(r)), solo = roots.filter(r => !kids.has(r));
    $('full').innerHTML = big.map(r => `<div class="g">${tree(r, 'root')}</div>`).join('') +
      (solo.length ? `<div class="g" style="margin-top:12px"><div class="hint" style="margin-bottom:4px">Chữ đứng riêng (câu chuyện không nhắc mảnh nào, cũng chưa dùng để ghép chữ khác) · ${solo.length} chữ</div><div class="solo">${solo.map(k => btn(k)).join('')}</div></div>` : '');
    $('allHint').textContent = `${ks.length} chữ + ${nodes.size - ks.length} mảnh ghép · ${big.length} gốc (bộ/chữ cơ bản), mỗi chữ treo dưới mảnh lớn nhất trong câu chuyện của nó. Bấm 1 lần xem câu chuyện, bấm đúp mở mind map riêng. Gõ chữ vào ô tìm để nhảy tới.`;
    $('full').addEventListener('click', e => { const b = e.target.closest('.n'); if (!b) return;
      $('full').querySelectorAll('.n.hit').forEach(x => x.classList.remove('hit')); b.classList.add('hit');
      sel = { v:'F', c:b.dataset.k }; showInfo(); });
    $('full').addEventListener('dblclick', e => { const b = e.target.closest('.n'); if (b){ setMode('one'); setCenter(b.dataset.k); } });
  }
  function jumpFull(c){
    const b = $('full').querySelector(`.n[data-k="${CSS.escape(c)}"]`); if (!b) return false;
    $('full').querySelectorAll('.n.hit').forEach(x => x.classList.remove('hit')); b.classList.add('hit');
    b.scrollIntoView({ behavior:'smooth', block:'center', inline:'center' }); sel = { v:'F', c }; showInfo(); return true;
  }
  let mode = 'one';
  function setMode(m){
    mode = m; document.body.classList.toggle('all', m === 'all');
    $('modeOne').classList.toggle('on', m === 'one'); $('modeAll').classList.toggle('on', m === 'all');
    $('oneWrap').classList.toggle('hidden', m !== 'one'); document.querySelector('.legend').classList.toggle('hidden', m !== 'one');
    $('allWrap').classList.toggle('hidden', m !== 'all'); $('back').classList.toggle('hidden', m !== 'one');
    if (m === 'all'){ buildFull(); if (center) jumpFull(center); }
    else render();
    try { history.replaceState(null, '', m === 'all' ? '#all' : '#' + encodeURIComponent(center)); } catch {}
  }
  $('modeOne').onclick = () => setMode('one');
  $('modeAll').onclick = () => setMode('all');

  $('back').onclick = () => { if (hist.length) setCenter(hist.pop(), false); };
  $('rand').onclick = () => { const c = ALL.filter(x => x.s), k = c[Math.floor(Math.random() * c.length)].k; if (mode === 'all') jumpFull(k); else setCenter(k); };
  $('find').addEventListener('change', e => {
    const q = e.target.value.trim(); if (!q) return;
    const ql = q.toLowerCase();
    const x = BYK.get(q) || RADK.get(q) || ALL.find(x => String(x.n) === q || x.hv.toLowerCase() === ql) || ALL.find(x => x.hv.toLowerCase().includes(ql) || x.m.toLowerCase().includes(ql));
    if (!x) return;
    if (mode === 'all') jumpFull(x.k); else setCenter(x.k);
  });
  addEventListener('resize', () => center && mode === 'one' && render());

  const start = decodeURIComponent(location.hash.slice(1)) || '肺';
  setCenter(info(start) ? start : '肺', false);
  if (start === 'all' || /[?&]all=1/.test(location.search)) setMode('all');
})();
</script>
</body>
