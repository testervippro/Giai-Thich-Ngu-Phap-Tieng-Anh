<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Xem thẻ Kanji</title>
<style>
:root{
  --bg:#faf9f7; --card:#fff; --ink:#1c1917; --dim:#78716c; --line:#e7e5e4;
  --accent:#b45309; --accentbg:#fffbeb;
}
@media(prefers-color-scheme:dark){:root:not([data-t=light]){
  --bg:#1c1917; --card:#292524; --ink:#f5f5f4; --dim:#a8a29e; --line:#44403c;
  --accent:#fbbf24; --accentbg:#2a2115;
}}
*{box-sizing:border-box}
body{margin:0;padding:14px;background:var(--bg);color:var(--ink);
  font-family:-apple-system,system-ui,"Segoe UI",sans-serif;
  display:flex;flex-direction:column;align-items:center;min-height:100vh}
.wrap{max-width:640px;width:100%}
h1{font-size:17px;margin:0 0 12px;text-align:center}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;padding:10px;border:1px solid var(--line);border-radius:9px;
  background:var(--card);color:inherit;font:inherit;font-size:14px;cursor:pointer}
.tabs button.on{background:var(--accentbg);border-color:var(--accent);
  color:var(--accent);font-weight:700}
.setselect{display:block;width:100%;padding:10px;margin-bottom:12px;
  border:1px solid var(--line);border-radius:9px;background:var(--card);
  color:inherit;font:inherit;font-size:14px}
.frame{background:var(--card);border:1px solid var(--line);border-radius:13px;
  padding:12px;text-align:center}
img{max-width:100%;max-height:70vh;border-radius:8px;background:#fff;
  display:block;margin:0 auto}
.stat{margin-top:10px;font-size:13px;color:var(--dim)}
.prog{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
.nav{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:12px}
.nav button{padding:8px 16px;border:1px solid var(--line);border-radius:8px;
  background:var(--card);color:inherit;font:inherit;font-size:14px;cursor:pointer}
.nav button:disabled{opacity:.4;cursor:default}
.nav button.on{background:var(--accentbg);border-color:var(--accent);color:var(--accent);font-weight:700}
.speed{display:flex;align-items:center;gap:8px;justify-content:center;margin-top:10px;
  font-size:13px;color:var(--dim)}
.speed input{width:140px}
</style>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="kanji-game-data.js"></script>
<link rel="stylesheet" href="../assets/ui.css">
<script src="../assets/ui.js" data-section="Tiếng Nhật" data-title="Xem thẻ Kanji"></script>
</head>
<body>
<div class="wrap">
  <h1>🃏 Xem thẻ Kanji</h1>
  <a href="game.html" style="display:block;text-align:center;margin:-4px 0 12px;padding:10px;border:1px solid var(--accent);border-radius:9px;background:var(--accentbg);color:var(--accent);font-weight:700;text-decoration:none">🎮 Chơi game Kanji (trắc nghiệm, ghép cặp, sinh tồn)</a>
  <select id="setSelect" class="setselect">
    <option value="p1">Tập 1</option>
    <option value="p2">Tập 2</option>
    <option value="p12">Đủ cả P1+P2</option>
    <option value="c1000">1000 từ thông dụng</option>
    <option value="n5">JLPT N5</option>
    <option value="n4">JLPT N4</option>
    <option value="n3">JLPT N3</option>
    <option value="n2">JLPT N2</option>
    <option value="n1">JLPT N1</option>
  </select>
  <div class="tabs" id="viewTabs">
    <button data-view="img">🖼 Ảnh thẻ</button>
    <button data-view="text">📝 Chữ + câu chuyện</button>
    <button data-view="list">📋 Danh sách cả bộ</button>
  </div>
  <div id="plainList" class="frame" style="display:none;text-align:left"></div>
  <div class="frame">
    <img id="img" alt="">
    <div id="txtCard" style="display:none;padding:6px 4px">
      <div id="tK" style="font-size:96px;line-height:1.1;font-family:'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif"></div>
      <div id="tHV" style="font-size:22px;font-weight:800;margin-top:4px"></div>
      <div id="tM" style="font-size:17px;margin-top:2px"></div>
      <div id="tTag" class="stat" style="margin-top:2px"></div>
      <div id="tS" style="font-size:16px;line-height:1.55;margin-top:12px;text-align:left"></div>
    </div>
    <div class="stat" id="stat"></div>
    <div class="prog"><i id="bar"></i></div>
    <input type="range" id="jumpSlider" min="1" max="1" value="1" step="1"
      style="width:100%;margin-top:6px">
    <div class="stat" id="eta" style="margin-top:2px"></div>
    <div class="stat" id="enText" style="margin-top:4px;font-style:italic;display:none"></div>
    <div class="stat" id="ttsStatus" style="margin-top:2px;color:#c0392b;display:none"></div>
  </div>
  <button id="ttsUnlock" style="display:none;width:100%;margin-top:8px;padding:10px;
      font-size:15px;font-weight:700;background:var(--accentbg);color:var(--accent);
      border:1px solid var(--accent);border-radius:8px;cursor:pointer">
    🔊 Bấm vào đây để bật đọc to (trình duyệt chặn tự phát âm thanh khi vừa mở trang)
  </button>
  <div class="nav">
    <button id="prev">← Trước</button>
    <button id="play">⏸ Tạm dừng</button>
    <button id="next">Sau →</button>
    <button id="speak">🔇 Đọc to</button>
  </div>
  <div class="nav">
    <button id="markKnown">✅ Đã nhớ</button>
    <button id="markUnknown">❌ Chưa nhớ</button>
    <button id="toggleStar">⭐ Khó nhớ</button>
  </div>
  <div class="speed">
    <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
      <input type="checkbox" id="onlyUnknown">
      <span>Chỉ ôn chữ chưa nhớ</span>
    </label>
    <label style="display:flex;align-items:center;gap:6px;cursor:pointer;margin-left:12px">
      <input type="checkbox" id="onlyStarred">
      <span>Chỉ xem thẻ đã ⭐ đánh dấu</span>
    </label>
  </div>
  <div class="speed" id="speedRow">
    <span>Tốc độ:</span>
    <input type="range" id="speed" min="0.5" max="8" step="0.5" value="2">
    <span id="speedTxt">2.0s / ảnh</span>
  </div>
  <div class="speed">
    <span>Tốc độ đọc:</span>
    <input type="range" id="speakRate" min="0.5" max="10" step="0.1" value="1">
    <span id="speakRateTxt">1.0x</span>
  </div>
  <div class="speed">
    <span>Âm lượng:</span>
    <input type="range" id="speakVolume" min="0" max="1" step="0.05" value="1">
    <span id="speakVolumeTxt">100%</span>
  </div>
  <div class="speed">
    <label style="display:flex;align-items:center;gap:6px;cursor:pointer">
      <input type="checkbox" id="fastMode">
      <span>Đọc nhanh — ép mỗi ảnh tối đa</span>
    </label>
    <input type="range" id="fastCap" min="0.5" max="5" step="0.1" value="1.5" style="margin-left:8px">
    <span id="fastCapTxt">1.5s</span>
  </div>
  <div class="speed">
    <span>Ngôn ngữ đọc:</span>
    <select id="speakLang" class="setselect" style="margin:0;width:auto;padding:6px 8px;font-size:13px">
      <option value="vi">Tiếng Việt</option>
      <option value="en">English</option>
    </select>
  </div>
  <div class="speed">
    <span>Giọng đọc:</span>
    <select id="voiceSelect" class="setselect" style="margin:0;width:auto;flex:1;padding:6px 8px;font-size:13px">
      <option value="">Mặc định hệ thống</option>
    </select>
  </div>
</div>

function voiceForLang(lang){
  if (!("speechSynthesis" in window)) return null;
  if (lang !== "en") return chosenVoice;
  if (chosenVoice && chosenVoice.lang && chosenVoice.lang.toLowerCase().startsWith("en")) return chosenVoice;

function showTtsStatus(msg){
  const el = $("ttsStatus");
  if (!el) return;
  el.textContent = msg;
  el.style.display = msg ? "block" : "none";

// Chrome/Edge chặn speechSynthesis.speak() nếu trang chưa nhận được thao tác
// nào từ người dùng (click/gõ phím...) — trang này tự đọc ngay lúc tải xong
// nên gần như luôn bị chặn ở lượt đầu. Hiện nút để người dùng bấm 1 cái là
// "mở khoá" vĩnh viễn cho cả phiên, không cần bấm lại nữa sau đó.
let ttsUnlocked = false;
function showTtsUnlock(){
  if (ttsUnlocked) return;
  $("ttsUnlock").style.display = "block";
}
function hideTtsUnlock(){
  ttsUnlocked = true;
  $("ttsUnlock").style.display = "none";
}
$("ttsUnlock").addEventListener("click", () => {
  hideTtsUnlock();
  if (speakOn) speakCurrent();
});
// Bấm/gõ bất kỳ đâu trên trang cũng tính là thao tác hợp lệ — tự thử đọc lại
// luôn, khỏi bắt phải bấm đúng vào nút thông báo mới chịu mở khoá.
function unlockTtsOnFirstInteraction(){
  hideTtsUnlock();
  if (speakOn) speakCurrent();
}
document.addEventListener("click", unlockTtsOnFirstInteraction, { once: true, capture: true });
document.addEventListener("keydown", unlockTtsOnFirstInteraction, { once: true, capture: true });

function pickVoice(){
  if (!("speechSynthesis" in window)) return;
  const vs = speechSynthesis.getVoices();
  if (!vs.length) return;
  showTtsStatus("");

  const sel = $("voiceSelect");
  const keepValue = sel.value || savedVoiceName;
  while (sel.options.length > 1) sel.remove(1);
  const vi = vs.filter(v => v.lang && v.lang.toLowerCase().startsWith("vi"));
  const rest = vs.filter(v => !vi.includes(v));
  for (const v of [...vi, ...rest]){
    const opt = document.createElement("option");
    opt.value = v.name;
    opt.textContent = v.name + " (" + v.lang + ")";
    sel.appendChild(opt);
  }
  if (keepValue && vs.some(v => v.name === keepValue)) sel.value = keepValue;

  chosenVoice = vs.find(v => v.name === sel.value) || vi[0] || null;
}
if ("speechSynthesis" in window){
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
  // Danh sách giọng đọc tải bất đồng bộ — nếu sau vài giây vẫn rỗng thì trình
  // duyệt/máy này không có giọng đọc hệ thống nào, báo rõ thay vì im lặng mãi.
  setTimeout(() => {
    if (!speechSynthesis.getVoices().length){
      showTtsStatus("⚠️ Không tìm thấy giọng đọc (TTS) nào trên trình duyệt/máy này — phần đọc to sẽ không phát ra tiếng.");
    }
  }, 2000);
} else {
  showTtsStatus("⚠️ Trình duyệt này không hỗ trợ Web Speech API (đọc to) — dùng Chrome/Edge/Safari mới hơn.");
}
function cardNumber(path){
  const m = path.match(/(\d{4})\.webp$/);
  return m ? m[1] : null;
}
function stopSpeaking(){
  speakGen++;   // vô hiệu hoá mọi lượt đọc đang dở
  if ("speechSynthesis" in window && speechSynthesis.speaking) speechSynthesis.cancel();
}

// ---- Quét chữ trên ảnh (OCR) rồi tra câu chuyện — giống app remind voca ----
// (app dùng ML Kit quét ảnh rồi khớp với kanji.txt; ở đây dùng Tesseract.js
// quét rồi khớp với CHAR_STORY). Cache theo đường dẫn ảnh + chạy trước
// (prefetch) vài thẻ kế tiếp song song cho nhanh — nhưng vì cache lưu theo
// TỪNG ẢNH nên dù ảnh nào quét xong trước, lúc đọc vẫn luôn lấy đúng kết quả
// của ảnh đang hiện, không bao giờ bị lẫn/lệch thứ tự.
const ocrCache = new Map();     // path -> Promise<string|null> (chữ Hán khớp được)
const OCR_PREFETCH_AHEAD = 3;   // quét trước tối đa 3 thẻ kế tiếp

// Lưu lại kết quả OCR vào localStorage — quét 1 lần rồi dùng mãi, lần sau mở
// lại trang không phải quét lại từ đầu (đỡ chờ, đọc nhanh hơn hẳn từ lượt 2).
const OCR_PERSIST_KEY = "kanjiViewerOcrCache";
let ocrPersist = {};
try { ocrPersist = JSON.parse(localStorage.getItem(OCR_PERSIST_KEY) || "{}"); } catch (e) { ocrPersist = {}; }
let ocrSaveTimer = null;
function saveOcrPersist(){
  // Gộp nhiều lượt lưu gần nhau thành 1 lần ghi — quét trước nhiều ảnh cùng
  // lúc thì khỏi ghi localStorage liên tục.
  clearTimeout(ocrSaveTimer);
  ocrSaveTimer = setTimeout(() => {
    try { localStorage.setItem(OCR_PERSIST_KEY, JSON.stringify(ocrPersist)); } catch (e) {}
  }, 500);
}

// Trước đây dùng 1 worker Tesseract duy nhất — quét trước nhiều ảnh "song song"
// thật ra vẫn bị xếp hàng chạy tuần tự trên cùng 1 worker, nên tới lúc cần
// đọc thẻ kế tiếp có khi nó vẫn chưa quét xong (chuyển ảnh bị khựng).
// Dùng vài worker luân phiên để quét thật sự cùng lúc, đỡ phải chờ.
const OCR_WORKER_POOL_SIZE = 2;
let ocrWorkers = [];
let ocrWorkerTurn = 0;
function getOcrWorker(){
  if (ocrWorkers.length < OCR_WORKER_POOL_SIZE){
    const idx = ocrWorkers.length;
    const p = Tesseract.createWorker("jpn").catch(err => {
      ocrWorkers[idx] = null;
      throw err;
    });
    ocrWorkers.push(p);
    return p;
  }
  const w = ocrWorkers[ocrWorkerTurn % ocrWorkers.length];
  ocrWorkerTurn++;
  return w;
}

// Ảnh có cả câu chuyện tiếng Việt lẫn nhiều chữ Hán nhỏ khác (bảng từ vựng...),
// nên quét ra nhiều chữ — chỉ nhận chữ ĐẦU TIÊN mà tra được trong CHAR_STORY
// (chữ chính của thẻ luôn được vẽ to/đậm nên OCR thường đọc ra trước).
function pickKnownChar(rawText){
  if (!rawText) return null;
  const matches = rawText.match(/[\u4e00-\u9fff]/g);
  if (!matches) return null;
  for (const ch of matches){
    if (CHAR_STORY[ch]) return ch;
  }
  return null;
}

function ocrImage(path){
  if (ocrCache.has(path)) return ocrCache.get(path);
  // Đã quét ảnh này ở lần mở trang trước rồi — dùng lại luôn, khỏi quét nữa.
  // (ocrPersist[path] có thể là null = đã quét nhưng không khớp được chữ nào,
  // vẫn tính là "đã biết kết quả", không quét lại.)
  if (Object.prototype.hasOwnProperty.call(ocrPersist, path)){
    const cached = Promise.resolve(ocrPersist[path]);
    ocrCache.set(path, cached);
    return cached;
  }
  const p = (async () => {
    try {
      const worker = await getOcrWorker();
      const { data } = await worker.recognize(path);
      const ch = pickKnownChar(data && data.text);
      ocrPersist[path] = ch;
      saveOcrPersist();
      return ch;
    } catch (e){
      return null;
    }
  })();
  ocrCache.set(path, p);
  return p;
}

// Quét trước thẻ hiện tại + vài thẻ kế tiếp CÙNG LÚC (song song), không đợi
// nhau — chỉ để "làm nóng" cache trước khi thật sự cần đọc, cho đỡ giật.
function prefetchOcr(fromIndex){
  if (!list.length) return;
  for (let k = 0; k <= OCR_PREFETCH_AHEAD; k++){
    const path = list[(fromIndex + k) % list.length];
    if (path) ocrImage(path);   // không await — chạy song song, tự cache khi xong
  }
}

// Ảnh thẻ gốc khá nặng — tải thẳng vào thẻ <img> mỗi lần chuyển thì phải chờ
// tải lại từ đĩa, đó là lý do chuyển ảnh bị khựng ~1-2s. Tải trước (decode
// sẵn vào bộ nhớ đệm của trình duyệt) vài ảnh kế tiếp trong lúc đang xem ảnh
// hiện tại, để lúc cần hiện là đã có sẵn, không phải chờ tải nữa.
const IMG_PREFETCH_AHEAD = 4;
const imgPreloaded = new Set();
function prefetchImages(fromIndex){
  if (!list.length) return;
  for (let k = 0; k <= IMG_PREFETCH_AHEAD; k++){
    const path = list[(fromIndex + k) % list.length];
    if (path && !imgPreloaded.has(path)){
      imgPreloaded.add(path);
      const im = new Image();
      im.src = path;
    }
  }
}

// Đọc xong thì tự sang thẻ sau (nghỉ một nhịp cho đỡ giật), giống app remind voca.
// Chrome có lỗi vặt là gọi speak() ngay sau cancel() đôi khi bị nuốt mất câu đầu,
// nên nhường một nhịp cho hàng đợi đọc rỗng hẳn rồi mới đọc câu mới.
async function speakCurrent(){
  // Tắt đọc to thì vẫn tra và hiện chữ tiếng Anh bên dưới, chỉ không phát tiếng.
  if (!list.length) return;
  const gen = ++speakGen;
  const path = list[i];
  prefetchOcr(i);   // tranh thủ quét trước các thẻ sắp tới trong lúc đọc thẻ này

  let text = null;
  let matchedChar = null;
  const num = cardNumber(path);
  if ("Tesseract" in window){
    // OCR đôi khi bị treo (vd mở file trực tiếp qua file:// không tải được
    // model) — giới hạn thời gian chờ, quá hạn thì bỏ qua, đừng để đọc bị
    // câm hẳn vì kẹt chờ OCR mãi không xong.
    const timeout = new Promise(resolve => setTimeout(() => resolve(null), 1200));
    const ch = await Promise.race([ocrImage(path), timeout]);
    if (gen !== speakGen) return;   // đã sang thẻ khác trong lúc chờ OCR
    if (ch) { text = CHAR_STORY[ch]; matchedChar = ch; }
  }
  if (!text){
    // OCR không nhận ra hoặc quét lỗi — lùi về tra theo số thẻ như cũ, vẫn đọc được.
    text = num ? STORY[num] : null;
  }
  const clean = (s) => s && s.replace(/\s*\([^)]*\)/g, "").replace(/\s{2,}/g, " ").trim();
  // Bỏ phần chữ Hán chú thích trong ngoặc (vd "(一)") — giọng đọc tiếng Việt
  // không đọc được, gặp là khựng lại nghe rất vấp. Bỏ đi câu vẫn đủ nghĩa vì
  // đó chỉ là chú thích hình ảnh, không cần khi nghe.
  text = clean(text);

  // Text tiếng Anh hiện bên dưới (nếu đã có dữ liệu dịch — STORY_EN/CHAR_STORY_EN).
  // Chưa có thì ẩn hẳn, không báo lỗi gì.
  let enText = null;
  if (typeof CHAR_STORY_EN !== "undefined" && matchedChar) enText = CHAR_STORY_EN[matchedChar];
  if (!enText && typeof STORY_EN !== "undefined" && num) enText = STORY_EN[num];
  enText = clean(enText);
  const enEl = $("enText");
  if (enText){ enEl.textContent = enText; enEl.style.display = "block"; }
  else { enEl.textContent = ""; enEl.style.display = "none"; }

  if (!speakOn || !("speechSynthesis" in window)) return;

  // Đọc tiếng Anh nếu được chọn và có bản dịch; thiếu bản dịch thì lùi về tiếng Việt.
  let readLang = "vi";
  if (speakLang === "en" && enText){ text = enText; readLang = "en"; }

  const wasSpeaking = speechSynthesis.speaking || speechSynthesis.pending;
  if (wasSpeaking) speechSynthesis.cancel();
  const advance = () => {
    if (gen !== speakGen || !playing || !speakOn) return;
    setTimeout(() => { if (gen === speakGen && playing && speakOn) step(1); }, SPEAK_GAP_MS);
  };
  if (!text){
    if (playing) setTimeout(advance, 0);
    return;
  }
  setTimeout(() => {
    if (gen !== speakGen) return;   // đã sang thẻ khác trong lúc chờ hàng đợi rỗng
    const u = new SpeechSynthesisUtterance(text);
    u.lang = readLang === "en" ? "en-US" : "vi-VN";
    u.rate = speakRate;
    u.volume = speakVolume;
    const useVoice = voiceForLang(readLang);
    if (useVoice) u.voice = useVoice;
    speakStartedAt = performance.now();
    let settled = false;
    const finishOnce = () => {
      if (settled) return;
      settled = true;
      recordDuration(gen);
      advance();
    };
    u.onstart = () => { showTtsStatus(""); hideTtsUnlock(); consecutiveStuck = 0; };
    u.onend = finishOnce;
    u.onerror = (ev) => {
      // "interrupted"/"canceled" là bình thường (bị cắt vì chuyển ảnh). "not-allowed"
      // là lỗi chính sách trình duyệt: chặn tự phát âm thanh khi trang vừa mở, chưa
      // có thao tác (bấm/gõ) nào của người dùng — rất hay gặp vì trang tự đọc ngay
      // lúc tải xong. Phải chờ 1 cú bấm bất kỳ rồi mới đọc được, nên hiện nút rõ
      // ràng để người dùng bấm, thay vì chỉ báo lỗi chung chung không biết làm sao.
      if (ev && ev.error === "not-allowed"){
        showTtsUnlock();
      } else if (ev && ev.error && ev.error !== "interrupted" && ev.error !== "canceled"){
        showTtsStatus("⚠️ Lỗi đọc to: " + ev.error);
      }
      finishOnce();
    };
    speechSynthesis.speak(u);
    if (fastMode){
      // Đọc nhanh: hết hạn mức là cắt ngang (dù câu chuyện còn đang đọc dở)
      // rồi sang ảnh sau luôn, để lướt ôn nhanh thay vì đợi đọc hết câu dài.
      setTimeout(() => {
        if (gen !== speakGen || settled) return;
        speechSynthesis.cancel();
        finishOnce();
      }, fastCapSec * 1000);
    }
    // Chrome có lỗi vặt hiếm gặp: cancel() rồi speak() liên tục nhiều lượt có
    // thể làm hàng đợi đọc bị "treo" vĩnh viễn — không bắn onend/onerror nữa,
    // cả app im bặt từ đó về sau dù chuyển ảnh vẫn chạy bình thường. Đặt một
    // hạn chót dư dả, quá hạn mà chưa xong thì coi như treo, tự reset rồi
    // chuyển tiếp, đừng để bị câm hẳn không tự hồi phục được.
    const watchdogMs = Math.max(6000, (text.length * 200) / Math.max(speakRate, 0.5));
    setTimeout(() => {
      if (gen !== speakGen || settled) return;
      consecutiveStuck++;
      showTtsStatus("⚠️ Hàng đợi đọc bị treo (lỗi trình duyệt) — đã tự reset, chuyển ảnh tiếp.");
      speechSynthesis.cancel();
      finishOnce();
    }, watchdogMs);
  }, wasSpeaking ? Math.min(120 + consecutiveStuck * 300, 1500) : 0);
}

/** Ghi lại thời gian đọc thật của lượt vừa xong, dùng cửa sổ trượt gần nhất. */
function recordDuration(gen){
  if (gen !== speakGen || !speakStartedAt) return;
  const ms = performance.now() - speakStartedAt;
  if (ms <= 0 || ms > 30000) return;   // bất thường thì bỏ, đừng làm lệch trung bình
  speakDurations.push(ms);
  if (speakDurations.length > SPEAK_SAMPLE_MAX) speakDurations.shift();
  updateEta();
}

function formatEta(ms){
  const totalSec = Math.round(ms / 1000);
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  if (h > 0) return h + ":" + String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
  return m + ":" + String(s).padStart(2, "0");
}

/**
 * "Còn bao lâu thì đọc hết" (tới cuối danh sách hiện tại) — chỉ hiện khi đang
 * bật đọc to và đã có vài mẫu thời gian thật, đoán khi chưa đo gì thì hiện số
 * vô nghĩa còn tệ hơn không hiện.
 */
function updateEta(){
  const el = $("eta");
  if (!el) return;
  if (!list.length){
    el.textContent = "";
    return;
  }
  const remaining = Math.max(0, list.length - 1 - i);
  if (remaining === 0){
    el.textContent = "Sắp xong lượt này.";
    return;
  }
  let msPerCard;
  if (speakOn && speakDurations.length >= 3){
    // Đang đọc to và đã đo được vài mẫu thật — dùng thời gian đọc thật, chính xác hơn.
    const avg = speakDurations.reduce((a, b) => a + b, 0) / speakDurations.length;
    msPerCard = avg + SPEAK_GAP_MS;
  } else if (!speakOn){
    // Tắt đọc to thì không có gì để đo — ước lượng theo tốc độ chuyển ảnh đang cài.
    msPerCard = secs * 1000;
  } else {
    // Vừa bật đọc to, chưa kịp đo mẫu nào — chưa đủ căn cứ để hiện số.
    el.textContent = "";
    return;
  }
  const etaMs = remaining * msPerCard;
  el.textContent = "còn ~" + formatEta(etaMs) + " · " + remaining + " thẻ";
}

/** Đánh dấu thẻ đang hiện là đã nhớ / chưa nhớ, rồi lọc lại danh sách nếu cần. */
function markCurrent(isKnown){
  const path = list[i];
  if (!path) return;
  if (isKnown) known[path] = true; else delete known[path];
  saveKnown();
  if (onlyUnknown){
    list = applyKnownFilter(baseList());
    i = Math.min(i, Math.max(0, list.length - 1));
  }
  render();
  restartTimer();
}

/** Bật/tắt đánh dấu "khó nhớ" cho thẻ đang hiện, rồi lọc lại danh sách nếu cần. */
function toggleStar(){
  const path = list[i];
  if (!path) return;
  if (starred[path]) delete starred[path]; else starred[path] = true;
  saveStarred();
  if (onlyStarred){
    list = applyKnownFilter(baseList());
    i = Math.min(i, Math.max(0, list.length - 1));
  }
  render();
  restartTimer();
}

function render(){
  $("setSelect").value = set;
  $("toggleStar").classList.toggle("on", !!(list[i] && starred[list[i]]));
  if (!list.length){
    $("img").removeAttribute("src");
    $("stat").textContent = onlyStarred
      ? "Chưa có thẻ nào được đánh dấu ⭐ trong bộ này."
      : onlyUnknown
      ? "Hết chữ chưa nhớ trong bộ này — giỏi quá! 🎉"
      : "Không tìm thấy ảnh nào trong thư mục kanji_" + set + ".";
    $("bar").style.width = "0%";
    $("eta").textContent = "";
    $("enText").style.display = "none";
    return;
  }
  renderView();
  if (view === "img") { $("img").src = list[i]; prefetchImages(i); }   // tải trước vài ảnh kế tiếp, lần sau chuyển tới sẽ có sẵn luôn
  $("stat").textContent = (i + 1) + " / " + list.length + "  ·  " + list[i]
    + (known[list[i]] ? "  ✅" : "") + (starred[list[i]] ? "  ⭐" : "");
  $("bar").style.width = ((i + 1) / list.length * 100) + "%";
  $("prev").disabled = list.length < 2;
  $("next").disabled = list.length < 2;
  $("jumpSlider").max = list.length;
  $("jumpSlider").value = i + 1;
  localStorage.setItem("kanjiViewer_" + set + "_i", i);
  updateEta();   // cập nhật ngay số thẻ còn lại, không đợi đọc xong thẻ này mới tính
  if (view !== "list") speakCurrent();
}

function step(delta){
  if (!list.length) return;
  i = (i + delta + list.length) % list.length;   // loop cả 2 đầu
  render();
}

function restartTimer(){
  clearInterval(timer);
  if (view === "list") return;
  // Khi đang đọc to thì tiếng đọc xong mới chuyển thẻ, không dùng đồng hồ cố định nữa.
  if (playing && list.length > 1 && !speakOn) timer = setInterval(() => step(1), secs * 1000);
}

function setTab(newSet){
  if (newSet === set) return;
  set = newSet;
  localStorage.setItem("kanjiViewerSet", set);
  list = applyKnownFilter(baseList());
  i = Math.min(Math.max(0, +localStorage.getItem("kanjiViewer_" + set + "_i") || 0), list.length - 1);
  render();
  restartTimer();
}

$("setSelect").addEventListener("change", (e) => setTab(e.target.value));
function escT(s){ return String(s || "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function renderView(){
  document.querySelectorAll("#viewTabs button").forEach(b => b.classList.toggle("on", b.dataset.view === view));
  const isList = view === "list";
  document.querySelector(".frame:not(#plainList)").style.display = isList ? "none" : "";
  $("plainList").style.display = isList ? "" : "none";
  $("img").style.display = view === "img" ? "" : "none";
  $("txtCard").style.display = view === "text" ? "" : "none";
  if (view === "text" && list[i]){
    const r = KTXT.get(cardNumber(list[i]));
    $("tK").textContent = r ? r[1] : "?";
    $("tHV").textContent = r ? r[2] : "";
    $("tM").textContent = r ? r[3] : "(chưa có dữ liệu chữ cho thẻ này)";
    $("tTag").textContent = "#" + (i + 1) + " / " + list.length + " · Thẻ " + (+cardNumber(list[i])) + (r && r[4] ? " · " + r[4] : "");
    $("tS").textContent = r && r[5] ? "📖 " + r[5] : "";
  }
  if (isList) renderPlainList();
}
let plainListFor = null;
function renderPlainList(){
  const key = set + "|" + list.length;
  if (plainListFor === key) return;
  plainListFor = key;
  const rows = list.map((p, ix) => {
    const r = KTXT.get(cardNumber(p));
    if (!r) return `<div style="padding:8px 0;border-bottom:1px solid var(--line)"><span style="display:inline-block;min-width:2.6em;margin-right:8px;padding:2px 8px;border-radius:999px;background:var(--accentbg);color:var(--accent);font-weight:700;font-size:14px;text-align:center;vertical-align:middle">${ix + 1}</span> Thẻ ${+cardNumber(p)} (chưa có dữ liệu chữ)</div>`;
    return `<div style="padding:8px 0;border-bottom:1px solid var(--line)"><span style="display:inline-block;min-width:2.6em;margin-right:8px;padding:2px 8px;border-radius:999px;background:var(--accentbg);color:var(--accent);font-weight:700;font-size:14px;text-align:center;vertical-align:middle">${ix + 1}</span><span style="font-size:26px;font-family:'Hiragino Mincho ProN','Yu Mincho','Noto Serif JP',serif">${escT(r[1])}</span>
      <b>${escT(r[2])}</b> – ${escT(r[3])} <span class="stat">(thẻ ${r[0]}${r[4] ? " · " + r[4] : ""})</span>
      ${r[5] ? `<div style="font-size:14px;line-height:1.5;margin-top:2px">📖 ${escT(r[5])}</div>` : ""}</div>`;
  });
  $("plainList").innerHTML = `<div class="stat" style="margin:0 0 6px">${list.length} chữ · bấm vào chữ nào để mở thẻ đó</div>` + rows.join("");
  [...$("plainList").children].slice(1).forEach((el, ix) => {
    el.style.cursor = "pointer";
    el.onclick = () => { i = ix; view = "text"; localStorage.setItem("kanjiViewerView", view); render(); restartTimer(); };
  });
}
document.querySelectorAll("#viewTabs button").forEach(b => b.addEventListener("click", () => {
  view = b.dataset.view;
  localStorage.setItem("kanjiViewerView", view);
  if (view === "list") { clearInterval(timer); stopSpeaking(); }
  render();
  if (view !== "list") restartTimer();
}));
$("prev").addEventListener("click", () => { stopSpeaking(); step(-1); restartTimer(); });
$("next").addEventListener("click", () => { stopSpeaking(); step(1); restartTimer(); });
$("markKnown").addEventListener("click", () => { stopSpeaking(); markCurrent(true); });
$("markUnknown").addEventListener("click", () => { stopSpeaking(); markCurrent(false); });
$("toggleStar").addEventListener("click", () => { toggleStar(); });
$("onlyUnknown").addEventListener("change", (e) => {
  onlyUnknown = e.target.checked;
  localStorage.setItem("kanjiViewerOnlyUnknown", onlyUnknown ? "1" : "0");
  list = applyKnownFilter(baseList());
  i = Math.min(i, Math.max(0, list.length - 1));
  render();
  restartTimer();
});
$("onlyStarred").addEventListener("change", (e) => {
  onlyStarred = e.target.checked;
  localStorage.setItem("kanjiViewerOnlyStarred", onlyStarred ? "1" : "0");
  list = applyKnownFilter(baseList());
  i = Math.min(i, Math.max(0, list.length - 1));
  render();
  restartTimer();
});
$("jumpSlider").addEventListener("input", (e) => {
  if (!list.length) return;
  stopSpeaking();
  i = Math.min(Math.max(0, (+e.target.value) - 1), list.length - 1);
  render();
  restartTimer();
});
$("play").addEventListener("click", () => {
  playing = !playing;
  $("play").textContent = playing ? "⏸ Tạm dừng" : "▶ Chạy";
  if (!playing) stopSpeaking(); else speakCurrent();
  restartTimer();
});
$("speed").addEventListener("input", (e) => {
  secs = +e.target.value;
  $("speedTxt").textContent = secs.toFixed(1) + "s / ảnh";
  localStorage.setItem("kanjiViewerSpeed", secs);
  updateEta();
  restartTimer();
});
$("speak").addEventListener("click", () => {
  speakOn = !speakOn;
  localStorage.setItem("kanjiViewerSpeak", speakOn ? "1" : "0");
  $("speak").textContent = speakOn ? "🔊 Đang đọc" : "🔇 Đọc to";
  $("speak").classList.toggle("on", speakOn);
  if (speakOn) speakCurrent(); else stopSpeaking();
  updateEta();
  restartTimer();
});
$("speakRate").addEventListener("input", (e) => {
  speakRate = +e.target.value;
  $("speakRateTxt").textContent = speakRate.toFixed(1) + "x";
  localStorage.setItem("kanjiViewerSpeakRate", speakRate);
  // Đổi tốc độ thì các mẫu thời gian cũ đo ở tốc độ khác không còn đúng nữa —
  // xoá để ước lượng bắt kịp tốc độ mới ngay.
  speakDurations.length = 0;
  if (speakOn) speakCurrent();   // đổi tốc độ thì nghe thấy ngay ở thẻ đang hiện
});
$("speakVolume").addEventListener("input", (e) => {
  speakVolume = +e.target.value;
  $("speakVolumeTxt").textContent = Math.round(speakVolume * 100) + "%";
  localStorage.setItem("kanjiViewerSpeakVolume", speakVolume);
  if (speakOn) speakCurrent();   // đổi âm lượng thì nghe thấy ngay ở thẻ đang hiện
});
// Thanh "Tốc độ" (giây/ảnh) chỉ có tác dụng khi KHÔNG đọc to; bật "Đọc nhanh"
// thì đã có thanh riêng ép thời gian/ảnh rồi — ẩn bớt "Tốc độ" cho đỡ rối,
// 2 thanh cùng kiểu "giây mỗi ảnh" hiện cùng lúc dễ gây nhầm lẫn.
function updateSpeedRowVisibility(){
  $("speedRow").style.display = fastMode ? "none" : "flex";
}
$("fastMode").addEventListener("change", (e) => {
  fastMode = e.target.checked;
  localStorage.setItem("kanjiViewerFastMode", fastMode ? "1" : "0");
  updateSpeedRowVisibility();
  if (speakOn) speakCurrent();
});
$("fastCap").addEventListener("input", (e) => {
  fastCapSec = +e.target.value;
  $("fastCapTxt").textContent = fastCapSec.toFixed(1) + "s";
  localStorage.setItem("kanjiViewerFastCapSec", fastCapSec);
  if (speakOn && fastMode) speakCurrent();
});
$("speakLang").addEventListener("change", (e) => {
  speakLang = e.target.value === "en" ? "en" : "vi";
  localStorage.setItem("kanjiViewerSpeakLang", speakLang);
  speakDurations.length = 0;
  if (speakOn) speakCurrent();
});
$("voiceSelect").addEventListener("change", (e) => {
  savedVoiceName = e.target.value;
  localStorage.setItem("kanjiViewerVoiceName", savedVoiceName);
  const vs = ("speechSynthesis" in window) ? speechSynthesis.getVoices() : [];
  chosenVoice = vs.find(v => v.name === savedVoiceName) || null;
  if (speakOn) speakCurrent();   // đổi giọng thì nghe thấy ngay ở thẻ đang hiện
});

$("speed").value = secs;
$("speedTxt").textContent = secs.toFixed(1) + "s / ảnh";
$("speakRate").value = speakRate;
$("speakRateTxt").textContent = speakRate.toFixed(1) + "x";
$("speakLang").value = speakLang;
$("speakVolume").value = speakVolume;
$("speakVolumeTxt").textContent = Math.round(speakVolume * 100) + "%";
$("speak").textContent = speakOn ? "🔊 Đang đọc" : "🔇 Đọc to";
$("speak").classList.toggle("on", speakOn);
$("onlyUnknown").checked = onlyUnknown;
$("onlyStarred").checked = onlyStarred;
$("fastMode").checked = fastMode;
$("fastCap").value = fastCapSec;
$("fastCapTxt").textContent = fastCapSec.toFixed(1) + "s";
updateSpeedRowVisibility();
render();
restartTimer();
</script>
</body>
</html>
